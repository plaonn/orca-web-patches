name: Temporary verify dist

on:
  push:
    branches: [main]

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check canonical checkout
        run: npm run check
      - name: Verify committed artifact is deterministic build output
        run: |
          git hash-object dist/orca-web-patches.user.js
          git diff --exit-code -- dist/orca-web-patches.user.js
