name: Verify workspace removal 0.2.3 candidate

on:
  push:
    branches:
      - feature/workspace-removal-host-qualification-0.2.3

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify candidate
        run: npm run check
      - name: Commit generated candidate artifact
        shell: bash
        run: |
          if git diff --quiet -- dist/orca-web-patches.user.js; then
            echo "generated artifact already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/orca-web-patches.user.js
          git commit -m "build 0.2.3 candidate artifact [skip ci]"
          git push
