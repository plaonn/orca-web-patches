name: Verify automatic patch selection candidate

on:
  push:
    branches:
      - feature/automatic-patch-selection-0.2.0

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify candidate
        run: npm run check
      - name: Commit generated candidate artifact
        run: |
          if git diff --quiet -- dist/orca-web-patches.user.js; then
            echo "dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/orca-web-patches.user.js
          git commit -m "build 0.2.0 candidate artifact"
          git push
