name: Temporary build dist

on:
  push:
    branches: [main]

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check and build
        run: npm run check
      - name: Commit generated dist when token permits
        shell: bash
        run: |
          if git diff --quiet -- dist/orca-web-patches.user.js; then
            echo 'dist already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/orca-web-patches.user.js
          git commit -m 'build userscript 0.2.4'
          git push
