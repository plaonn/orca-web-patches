name: Temporary build 0.2.5

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check canonical checkout
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: userscript-025
          path: dist/orca-web-patches.user.js
