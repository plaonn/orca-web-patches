name: Temporary build 0.2.5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor == 'plaonn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check canonical checkout
        run: npm run check
      - name: Commit deterministic userscript
        shell: bash
        run: |
          if git diff --quiet -- dist/orca-web-patches.user.js; then
            echo 'dist already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/orca-web-patches.user.js
          git commit -m 'build userscript 0.2.5'
          git push
